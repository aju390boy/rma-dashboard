name: CI / CD — Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Run all tests
  # ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run test suite with coverage
        run: npm test -- --coverage --forceExit --passWithNoTests
        env:
          NODE_ENV: test
          JWT_SECRET: ci_jwt_secret_not_used_in_production
          JWT_REFRESH_SECRET: ci_refresh_secret_not_used_in_production
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: server/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Deploy backend to Render (only on push to main)
  # ─────────────────────────────────────────────────────────────
  deploy-backend:
    name: 🚀 Deploy Backend → Render
    runs-on: ubuntu-latest
    needs: test                          # Only runs if tests pass ✅
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 🔔 Trigger Render deploy hook
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        # Set RENDER_DEPLOY_HOOK_URL in GitHub repo Settings → Secrets

  # ─────────────────────────────────────────────────────────────
  # NOTE: Vercel deploys automatically via its GitHub integration.
  # No extra step needed — Vercel detects pushes to main itself.
  # ─────────────────────────────────────────────────────────────
